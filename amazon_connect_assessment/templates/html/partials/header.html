<!-- Report Header -->
<header class="report-header">
    <div class="header-content">
        <div>
            <h1 class="report-title">
                {% if service_icon_svg %}
                <span class="service-icon" role="img" aria-label="Amazon Connect">{{ service_icon_svg | safe }}</span>
                {% else %}
                <i class="fas fa-headset service-icon"></i>
                {% endif %}
                Amazon Connect Assessment Tool Report
            </h1>
            <p class="report-subtitle">Account: {{ assessment.account_id }} • Region: {{ assessment.region }}</p>
            <p class="report-subtitle">Assessment ID: {{ assessment.assessment_id }}</p>
        </div>
    </div>
</header>
